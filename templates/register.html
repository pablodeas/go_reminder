{{define "register"}}<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reminder — Cadastro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
{{template "base_css" .}}
<style>
.auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;}
.auth-wrap{width:100%;max-width:400px;}
.auth-header{text-align:center;margin-bottom:1.75rem;}
.auth-logo{font-family:'DM Serif Display',serif;font-size:1.75rem;color:var(--amber);margin-bottom:0.25rem;}
.auth-title{font-family:'DM Serif Display',serif;font-size:1.6rem;margin-bottom:0.2rem;}
.auth-sub{color:var(--muted);font-size:0.875rem;}
.auth-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:2rem;box-shadow:var(--shadow);}
.auth-footer{text-align:center;margin-top:1.25rem;font-size:0.875rem;color:var(--muted);}
.auth-footer a{color:var(--amber);text-decoration:none;}
.auth-footer a:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="auth-page">
  <div class="auth-wrap">
    <div class="auth-header">
      <div class="auth-logo">🔔 reminder</div>
      <h1 class="auth-title">Criar conta</h1>
      <p class="auth-sub">Comece a organizar seus lembretes</p>
    </div>
    <div class="auth-card">
      {{if .Error}}<div class="alert alert-error">⚠ {{.Error}}</div>{{end}}
      <form method="POST" action="/register" autocomplete="on">
        <div class="form-group">
          <label for="username">Usuário</label>
          <input id="username" type="text" name="username" class="form-control" placeholder="seu_usuario" required autofocus autocomplete="username">
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" name="email" class="form-control" placeholder="voce@email.com" required autocomplete="email">
          <small style="color:var(--muted);font-size:0.77rem;margin-top:0.2rem;display:block;">Usado para recuperar a senha</small>
        </div>
        <div class="form-group">
          <label for="password">Senha</label>
          <input id="password" type="password" name="password" class="form-control" placeholder="Mínimo 6 caracteres" required minlength="6" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label for="confirm">Confirmar Senha</label>
          <input id="confirm" type="password" name="confirm" class="form-control" placeholder="Repita a senha" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:0.7rem;margin-top:0.25rem;">Criar Conta</button>
      </form>
    </div>
    <div class="auth-footer">Já tem conta? <a href="/login">Entrar →</a></div>
  </div>
</div>
<div id="toast"></div>
{{template "base_js" .}}
</body></html>
{{end}}
